<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Vrinda Valley Resort</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logoo.png">

  <script src="auth.js"></script>
  <script>
    // Requirement 7: no valid token, no dashboard. Runs before anything renders,
    // so an unauthenticated visitor never sees the page behind the redirect.
    VVAuth.requireAuth();
  </script>

  <style>
    :root {
      --accent: #f6ac0f;
      --dark: #0f1a2c;
      --border: #e2e8f0;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }

    h2 { margin: 0 0 20px; }

    /* ---- Top bar ---- */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 14px 18px;
      background: var(--dark);
      border-radius: 8px;
      color: #fff;
    }

    .topbar__brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .topbar__brand img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .topbar__actions { display: flex; align-items: center; gap: 14px; }

    .topbar__user { font-size: 13px; color: #cbd5e1; }

    .topbar a, .topbar button {
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-site { background: transparent; color: #fff; border: 1px solid #475569; }
    .btn-site:hover { background: #1e293b; }

    .btn-logout { background: var(--accent); color: var(--dark); }
    .btn-logout:hover { opacity: 0.9; }

    /* ---- Stat cards ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 18px 20px;
      border-radius: 8px;
      background: #f1f1f1;
      border-left: 4px solid var(--muted);
    }

    .stat span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .stat strong { font-size: 26px; }

    .stat--total { background: #f1f1f1; border-left-color: #475569; }
    .stat--confirmed { background: #d4edda; border-left-color: #16a34a; }
    .stat--pending { background: #fff3cd; border-left-color: #d97706; }
    .stat--cancelled { background: #f8d7da; border-left-color: #dc2626; }

    /* ---- Filter bar ---- */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 18px;
      padding: 15px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .filter { display: flex; flex-direction: column; gap: 4px; }
    .filter label { font-size: 12px; color: var(--muted); font-weight: bold; }

    .filter input, .filter select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 14px;
      min-width: 150px;
    }

    .filters button {
      padding: 9px 16px;
      border: none;
      border-radius: 5px;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .filters button.secondary { background: var(--muted); }
    .filters button:hover { opacity: 0.9; }

    /* ---- Table ---- */
    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table { width: 100%; border-collapse: collapse; min-width: 900px; }

    th, td {
      padding: 10px;
      border: 1px solid var(--border);
      text-align: center;
      font-size: 14px;
    }

    th { background-color: var(--accent); color: white; white-space: nowrap; }

    tbody tr:nth-child(even) { background: #fafafa; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge--Pending { background: #fff3cd; color: #92400e; }
    .badge--Confirmed { background: #d4edda; color: #166534; }
    .badge--Cancelled { background: #f8d7da; color: #991b1b; }

    td button {
      padding: 5px 10px;
      margin: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #fff;
    }

    .btn-confirm { background: #16a34a; }
    .btn-cancel { background: #d97706; }
    .btn-delete { background: #dc2626; }
    td button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---- Pagination ---- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .pagination button {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination button:disabled { opacity: 0.45; cursor: not-allowed; }

    .state {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .filter, .filter input, .filter select { width: 100%; min-width: 0; }
      .filters { flex-direction: column; align-items: stretch; }

      .topbar { flex-direction: column; align-items: stretch; text-align: center; }
      .topbar__brand { justify-content: center; }
      .topbar__actions { justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="topbar__brand">
    <img src="assets/logoo.png" alt="">
    <span>VRINDA VALLEY RESORT &mdash; ADMIN</span>
  </div>
  <div class="topbar__actions">
    <span class="topbar__user" id="adminEmail"></span>
    <a href="index.html" class="btn-site">View Website</a>
    <button type="button" id="logoutBtn" class="btn-logout">Logout</button>
  </div>
</div>

<h2>All Bookings</h2>

<div class="stats">
  <div class="stat stat--total"><span>Total Bookings</span><strong id="total">0</strong></div>
  <div class="stat stat--pending"><span>Pending</span><strong id="pending">0</strong></div>
  <div class="stat stat--confirmed"><span>Confirmed</span><strong id="confirmed">0</strong></div>
  <div class="stat stat--cancelled"><span>Cancelled</span><strong id="cancelled">0</strong></div>
</div>

<div class="filters">
  <div class="filter">
    <label for="search">Search</label>
    <input type="search" id="search" placeholder="Name, email, phone or ID">
  </div>
  <div class="filter">
    <label for="statusFilter">Status</label>
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>
  <div class="filter">
    <label for="fromDate">Arrival From</label>
    <input type="date" id="fromDate">
  </div>
  <div class="filter">
    <label for="toDate">Arrival To</label>
    <input type="date" id="toDate">
  </div>
  <div class="filter">
    <label for="sortBy">Sort</label>
    <select id="sortBy">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="arrival">By Arrival Date</option>
    </select>
  </div>
  <button type="button" id="resetBtn" class="secondary">Reset</button>
</div>

<div class="table-wrap">
  <table id="bookingTable">
    <thead>
      <tr>
        <th>Booking ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Arrival</th>
        <th>Departure</th>
        <th>Guests</th>
        <th>Accommodation</th>
        <th>Status</th>
        <th>Booking Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookingBody">
      <tr><td colspan="11" class="state">Loading bookings...</td></tr>
    </tbody>
  </table>
</div>

<div class="pagination">
  <button type="button" id="prevBtn" disabled>&laquo; Previous</button>
  <span id="pageInfo">Page 1 of 1</span>
  <button type="button" id="nextBtn" disabled>Next &raquo;</button>
</div>

<script>
const PAGE_SIZE = 10;

let currentPage = 1;
let totalPages = 1;

/* ---------- helpers ---------- */

/** Escapes values before they are placed in the DOM (booking data is public input). */
function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(date) {
  if (!date) return "-";
  const d = new Date(date);
  return isNaN(d) ? "-" : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}

/**
 * Sends an authenticated request. VVAuth attaches the bearer token and, on a
 * 401/403, clears the session and returns to the login page.
 */
const apiRequest = (path, options) => VVAuth.apiRequest(path, options);

/** Delays a rapidly-firing handler so typing does not fire one request per keystroke. */
function debounce(fn, delay = 400) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

function buildQuery() {
  const params = new URLSearchParams({
    page: currentPage,
    limit: PAGE_SIZE,
    sort: document.getElementById("sortBy").value
  });

  const search = document.getElementById("search").value.trim();
  const status = document.getElementById("statusFilter").value;
  const from = document.getElementById("fromDate").value;
  const to = document.getElementById("toDate").value;

  if (search) params.set("search", search);
  if (status) params.set("status", status);
  if (from) params.set("from", from);
  if (to) params.set("to", to);

  return params.toString();
}

/* ---------- data loading ---------- */

async function loadBookings() {
  const tbody = document.getElementById("bookingBody");
  tbody.innerHTML = `<tr><td colspan="11" class="state">Loading bookings...</td></tr>`;

  try {
    const result = await apiRequest(`/api/bookings?${buildQuery()}`);
    const bookings = result.data || [];

    totalPages = result.pagination?.totalPages || 1;
    currentPage = result.pagination?.page || 1;

    if (bookings.length === 0) {
      tbody.innerHTML = `<tr><td colspan="11" class="state">No bookings match your filters.</td></tr>`;
    } else {
      // Built as one string, then assigned once — avoids re-parsing the table per row.
      tbody.innerHTML = bookings.map(rowTemplate).join("");
    }

    updatePagination();
  } catch (error) {
    console.error(error);
    tbody.innerHTML = `<tr><td colspan="11" class="state">Could not load bookings. ${escapeHtml(error.message)}</td></tr>`;
  }
}

/** e.g. ["Room","Pool"] with numberOfRooms=2 -> "Room (2), Pool" */
function formatAccommodation(b) {
  const types = Array.isArray(b.accommodationType) ? b.accommodationType : [];
  if (types.length === 0) return "-";
  return types.map((t) => (t === "Room" && b.numberOfRooms ? `${t} (${b.numberOfRooms})` : t)).join(", ");
}

function rowTemplate(b) {
  const id = escapeHtml(b._id);
  const status = escapeHtml(b.status || "Pending");
  // Special Request isn't its own column (keeps the table compact) — it
  // surfaces as a hover tooltip on the name instead, when present.
  const nameTitle = b.specialRequest ? ` title="Special request: ${escapeHtml(b.specialRequest)}"` : "";

  return `
    <tr>
      <td>${escapeHtml(b.bookingId || "-")}</td>
      <td${nameTitle}>${escapeHtml(b.name)}</td>
      <td>${escapeHtml(b.phone)}</td>
      <td>${escapeHtml(b.email)}</td>
      <td>${formatDate(b.arrival)}</td>
      <td>${formatDate(b.departure)}</td>
      <td>${escapeHtml(b.guests)}</td>
      <td>${escapeHtml(formatAccommodation(b))}</td>
      <td><span class="badge badge--${status}">${status}</span></td>
      <td>${formatDate(b.createdAt)}</td>
      <td>
        <button class="btn-confirm" onclick="updateStatus('${id}', 'Confirmed', this)" ${status === "Confirmed" ? "disabled" : ""}>Confirm</button>
        <button class="btn-cancel" onclick="updateStatus('${id}', 'Cancelled', this)" ${status === "Cancelled" ? "disabled" : ""}>Cancel</button>
        <button class="btn-delete" onclick="deleteBooking('${id}', this)">Delete</button>
      </td>
    </tr>
  `;
}

async function loadStats() {
  try {
    const result = await apiRequest("/api/bookings/stats");
    const stats = result.data || {};

    document.getElementById("total").innerText = stats.total ?? 0;
    document.getElementById("confirmed").innerText = stats.confirmed ?? 0;
    document.getElementById("pending").innerText = stats.pending ?? 0;
    document.getElementById("cancelled").innerText = stats.cancelled ?? 0;
  } catch (error) {
    console.error("Stats failed:", error);
  }
}

/* ---------- actions ---------- */

async function updateStatus(id, status, button) {
  if (button) button.disabled = true;

  try {
    await apiRequest(`/api/bookings/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    });

    await Promise.all([loadBookings(), loadStats()]);
  } catch (error) {
    alert(error.message || "Could not update the booking");
    if (button) button.disabled = false;
  }
}

async function deleteBooking(id, button) {
  if (!confirm("Are you sure you want to delete this booking? This cannot be undone.")) return;

  if (button) button.disabled = true;

  try {
    await apiRequest(`/api/bookings/${id}`, { method: "DELETE" });

    // Stepping back avoids landing on a page that no longer exists.
    const tbody = document.getElementById("bookingBody");
    if (tbody.children.length === 1 && currentPage > 1) currentPage--;

    await Promise.all([loadBookings(), loadStats()]);
  } catch (error) {
    alert(error.message || "Could not delete the booking");
    if (button) button.disabled = false;
  }
}

function updatePagination() {
  document.getElementById("pageInfo").innerText = `Page ${currentPage} of ${totalPages}`;
  document.getElementById("prevBtn").disabled = currentPage <= 1;
  document.getElementById("nextBtn").disabled = currentPage >= totalPages;
}

/* ---------- wiring ---------- */

function applyFilters() {
  currentPage = 1;
  loadBookings();
}

document.getElementById("search").addEventListener("input", debounce(applyFilters));
document.getElementById("statusFilter").addEventListener("change", applyFilters);
document.getElementById("fromDate").addEventListener("change", applyFilters);
document.getElementById("toDate").addEventListener("change", applyFilters);
document.getElementById("sortBy").addEventListener("change", applyFilters);

document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("search").value = "";
  document.getElementById("statusFilter").value = "";
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";
  document.getElementById("sortBy").value = "newest";
  applyFilters();
});

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentPage > 1) { currentPage--; loadBookings(); }
});

document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentPage < totalPages) { currentPage++; loadBookings(); }
});

/* ---------- session ---------- */

document.getElementById("adminEmail").innerText = VVAuth.getAdminEmail();

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (confirm("Log out of the admin dashboard?")) {
    // Clears the stored token, then returns to login.html.
    VVAuth.logout("You have been logged out.");
  }
});

// Catches a token that expires while the tab is left open, so the dashboard
// does not sit there looking usable until the next request fails.
setInterval(() => {
  if (!VVAuth.isAuthenticated()) {
    VVAuth.logout("Your session has expired. Please log in again.");
  }
}, 60000);

// requireAuth() in <head> already redirected if the token was missing/expired.
if (VVAuth.isAuthenticated()) {
  loadBookings();
  loadStats();
}
</script>

</body>
</html>
