<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Admin Password | Vrinda Valley Resort</title>

  <link rel="icon" href="assets/logoo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="auth.js"></script>
  <script>
    // An already-signed-in admin doesn't need to reset anything — send them
    // straight to the dashboard, same guard login.html uses.
    VVAuth.redirectIfAuthenticated();
  </script>

  <style>
    :root {
      --primary-color: #0f1a2c;
      --secondary-color: #f6ac0f;
      --text-dark: #0f172a;
      --text-light: #64748b;
      --white: #ffffff;
      --danger: #b91c1c;
      --header-font: "Playfair Display", serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Poppins", sans-serif;
      color: var(--text-dark);
      background-image:
        linear-gradient(rgba(15, 26, 44, 0.82), rgba(15, 26, 44, 0.82)),
        url("assets/header_img.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .login__card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.35);
    }

    .login__brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .login__brand img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e6e6e6;
    }

    .login__brand h1 {
      font-family: var(--header-font);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary-color);
    }

    .login__brand p {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .input__group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }

    .input__group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .input__group input {
      width: 100%;
      padding: 0.8rem 0.9rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-dark);
      border: 1px solid #d7dde5;
      border-radius: 7px;
      outline: none;
      transition: 0.3s;
    }

    .input__group input:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(246, 172, 15, 0.22);
    }

    .input__group small {
      font-size: 0.75rem;
      color: var(--text-light);
    }

    .btn {
      width: 100%;
      padding: 0.85rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn--primary {
      background: var(--secondary-color);
      color: var(--primary-color);
    }

    .btn--primary:hover:not(:disabled) { background: #dd980a; }

    .btn--ghost {
      margin-top: 0.7rem;
      background: transparent;
      color: var(--primary-color);
      border-color: #d7dde5;
    }

    .btn--ghost:hover { background: #f1f5f9; }

    .btn--link {
      width: auto;
      padding: 0;
      margin-top: 0.9rem;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 0.82rem;
      text-decoration: underline;
      display: block;
      text-align: center;
    }

    .btn--link:hover:not(:disabled) { color: var(--secondary-color); }

    .btn:disabled { opacity: 0.65; cursor: not-allowed; }

    /* Reserves no space until it has something to say. */
    .form__message {
      display: none;
      margin-bottom: 1.1rem;
      padding: 0.7rem 0.85rem;
      font-size: 0.85rem;
      border-radius: 7px;
      border: 1px solid transparent;
    }

    .form__message--error {
      display: block;
      color: var(--danger);
      background: #fee2e2;
      border-color: #fecaca;
    }

    .form__message--info {
      display: block;
      color: #92400e;
      background: #fff3cd;
      border-color: #fde68a;
    }

    .form__message--success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border-color: #bbf7d0;
    }

    .login__footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      text-align: center;
      color: var(--text-light);
    }

    .step { display: none; }
    .step.is-active { display: block; }

    @media (max-width: 480px) {
      body { padding: 1rem; background-attachment: scroll; }
      .login__card { padding: 2rem 1.25rem; }
      .login__brand h1 { font-size: 1.15rem; }
    }
  </style>
</head>

<body>

  <main class="login__card">
    <div class="login__brand">
      <img src="assets/logoo.png" alt="Vrinda Valley Resort logo">
      <h1>Vrinda Valley Resort</h1>
      <p>Admin Portal — password reset</p>
    </div>

    <!-- role=alert so screen readers announce success/failure -->
    <div id="formMessage" class="form__message" role="alert" aria-live="polite"></div>

    <!-- Step 1: request a code -->
    <form id="requestForm" class="step is-active" novalidate>
      <div class="input__group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" name="email" placeholder="admin@example.com"
               autocomplete="username" required>
      </div>

      <button type="submit" id="requestBtn" class="btn btn--primary">Send Reset Code</button>
      <button type="button" id="backBtn" class="btn btn--ghost">Back to Login</button>
    </form>

    <!-- Step 2: enter the code + new password -->
    <form id="resetForm" class="step" novalidate>
      <div class="input__group">
        <label for="otp">6-Digit Code</label>
        <input type="text" id="otp" name="otp" placeholder="123456" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code" required>
        <small>Sent to <span id="targetEmail"></span>. Expires in 10 minutes.</small>
      </div>

      <div class="input__group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters"
               autocomplete="new-password" minlength="8" required>
      </div>

      <div class="input__group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password"
               autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" id="resetBtn" class="btn btn--primary">Reset Password</button>
      <button type="button" id="resendBtn" class="btn--link">Didn't get a code? Resend</button>
    </form>

    <p class="login__footer">&copy; Vrinda Valley Resort</p>
  </main>

  <script>
    var requestForm = document.getElementById("requestForm");
    var resetForm = document.getElementById("resetForm");
    var emailInput = document.getElementById("email");
    var otpInput = document.getElementById("otp");
    var newPasswordInput = document.getElementById("newPassword");
    var confirmPasswordInput = document.getElementById("confirmPassword");
    var requestBtn = document.getElementById("requestBtn");
    var resetBtn = document.getElementById("resetBtn");
    var resendBtn = document.getElementById("resendBtn");
    var messageBox = document.getElementById("formMessage");
    var targetEmailLabel = document.getElementById("targetEmail");

    var isSubmitting = false;
    var lastRequestedEmail = "";

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "form__message form__message--" + (type || "error");
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "form__message";
    }

    function goToStep(step) {
      requestForm.classList.toggle("is-active", step === 1);
      resetForm.classList.toggle("is-active", step === 2);
    }

    document.getElementById("backBtn").addEventListener("click", function () {
      window.location.href = "login.html";
    });

    // Step 1: request a code. The API always returns the same generic success
    // response whether or not the account exists — this page never learns
    // (and never shows) which is the case.
    requestForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (isSubmitting) return;

      var email = emailInput.value.trim();
      if (!email) {
        showMessage("Please enter your admin email.");
        return;
      }

      isSubmitting = true;
      requestBtn.disabled = true;
      requestBtn.textContent = "Sending...";
      clearMessage();

      try {
        var body = await VVAuth.forgotPassword(email);
        lastRequestedEmail = email;
        targetEmailLabel.textContent = email;
        showMessage(body.message || "If an account exists for this email, a reset code has been sent.", "success");
        goToStep(2);
        otpInput.focus();
      } catch (error) {
        showMessage(error.message || "Could not send the reset code. Please try again.");
      } finally {
        isSubmitting = false;
        requestBtn.disabled = false;
        requestBtn.textContent = "Send Reset Code";
      }
    });

    resendBtn.addEventListener("click", async function () {
      if (isSubmitting || !lastRequestedEmail) return;

      isSubmitting = true;
      resendBtn.disabled = true;
      resendBtn.textContent = "Resending...";
      clearMessage();

      try {
        var body = await VVAuth.forgotPassword(lastRequestedEmail);
        showMessage(body.message || "A new code has been sent.", "success");
      } catch (error) {
        showMessage(error.message || "Could not resend the code. Please try again.");
      } finally {
        isSubmitting = false;
        resendBtn.disabled = false;
        resendBtn.textContent = "Didn't get a code? Resend";
      }
    });

    // Step 2: submit the code + new password.
    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (isSubmitting) return;

      var otp = otpInput.value.trim();
      var newPassword = newPasswordInput.value;
      var confirmPassword = confirmPasswordInput.value;

      if (!/^\d{6}$/.test(otp)) {
        showMessage("Enter the 6-digit code from your email.");
        return;
      }
      if (newPassword.length < 8) {
        showMessage("New password must be at least 8 characters.");
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      isSubmitting = true;
      resetBtn.disabled = true;
      resetBtn.textContent = "Resetting...";
      clearMessage();

      try {
        var body = await VVAuth.resetPassword(lastRequestedEmail, otp, newPassword);
        showMessage(body.message || "Password updated. Redirecting to login...", "success");
        VVAuth.clearLoginFailures(); // fresh password, drop any stale lockout hint state
        setTimeout(function () {
          window.location.replace("login.html");
        }, 1800);
      } catch (error) {
        showMessage(error.message || "Could not reset the password. Please try again.");
        otpInput.focus();
        isSubmitting = false;
        resetBtn.disabled = false;
        resetBtn.textContent = "Reset Password";
      }
    });
  </script>

</body>
</html>
